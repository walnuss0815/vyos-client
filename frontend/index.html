<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Runs synchronously before first paint, so there's no flash of
         the wrong theme - see public/theme-init.js for the full
         rationale (including why it's a separate static file rather
         than inline: a strict Content-Security-Policy script-src with
         no 'unsafe-inline' exception). Can't import the TS theme
         module here since this has to run before any module script
         loads. -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Overridden at runtime to the router's hostname once known,
         see Layout.tsx's DEFAULT_DOCUMENT_TITLE. -->
    <title>VyOS Client</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
