name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify sensitive-fields.json is in sync
        run: diff shared/sensitive-fields.json backend/internal/mask/sensitive-fields.json
        working-directory: .

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version: latest

      - name: go test
        run: go test ./... -race -cover -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  docker:
    name: Docker image build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          platforms: linux/amd64
          tags: vyos-client:ci

      - name: Validate docker-compose stack builds and starts
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose up --build -d
          timeout 30 sh -c 'until curl -skf https://localhost:8443/healthz; do sleep 1; done'
          docker compose logs
          docker compose down
