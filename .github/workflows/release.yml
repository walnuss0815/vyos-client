name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Compute version and publish GitHub release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Computes the next version from Conventional Commits since the
      # last release (see .releaserc.json), generates a changelog
      # grouped by category (Features/Bug Fixes/Performance
      # Improvements/Security/...), creates the git tag, and publishes
      # the GitHub Release with those notes. No package.json/lockfile
      # needed - only the default commit-analyzer/release-notes-
      # generator/github plugins are used (no npm publish).
      #
      # conventional-changelog-conventionalcommits is not bundled with
      # semantic-release itself - it's the separate package backing
      # .releaserc.json's `"preset": "conventionalcommits"` (needed for
      # the custom type-to-section mapping, e.g. the "security" type),
      # so it must be explicitly installed here. Pinned to major 9, not
      # the latest (10): v10 added a runtime check requiring
      # conventional-changelog-writer@9+, but @semantic-release/release-
      # notes-generator@25 still bundles writer@^8, so v10 fails with
      # "Missing helper" while rendering notes. v9 has no such
      # requirement and works with the writer this action's
      # semantic-release version actually ships.
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build and push multi-arch image
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `type=semver` normally only produces output on a real tag-push
      # event (it reads the version from the git ref that triggered
      # the workflow) - this workflow triggers on push to `main`, and
      # the tag semantic-release creates is pushed *within* the
      # `release` job above, so this job's own `github.ref` is still
      # `refs/heads/main`, never a tag ref. Without an explicit
      # `value=`, all three `type=semver` rules below silently produce
      # nothing, and only `latest` ever actually gets pushed - which
      # is exactly what happened for every release before this fix
      # (confirmed against the live GHCR package: no version-numbered
      # tags existed at all). Passing `value=` (the documented
      # workaround for non-tag-triggered semver tagging) fixes this.
      # `flavor: latest=false` disables metadata-action's own
      # "is this the highest semver" auto-latest heuristic, so tagging
      # stays fully explicit and controlled only by the `type=raw`
      # rule below - that heuristic is more fragile now that versions
      # come from an explicit value instead of a real tag ref anyway.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
