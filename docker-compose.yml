services:
  vyos-client:
    image: ghcr.io/walnuss0815/vyos-client:ac3eb0e74a53abfbae6d5872f1b12e9dd594e6d2
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
      VYOS_HOST: ${VYOS_HOST}
      VYOS_KEY: ${VYOS_KEY}
      VYOS_VERIFY_TLS: ${VYOS_VERIFY_TLS:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    restart: unless-stopped
