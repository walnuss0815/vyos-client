name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify sensitive-fields.json is in sync
        run: diff shared/sensitive-fields.json backend/internal/mask/sensitive-fields.json
        working-directory: .

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          working-directory: backend
          version: latest

      - name: go test
        run: go test ./... -race -cover -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: backend/coverage.out

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type-check + build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  trivy-fs:
    name: Vulnerability scan (Trivy, filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Scans go.sum and package-lock.json for known-vulnerable
      # dependencies (Go has no equivalent of `npm audit` wired into
      # CI otherwise - this covers that gap in one tool alongside
      # npm's), plus a lightweight secret scan over the working tree.
      # ignore-unfixed: only fails on CVEs that actually have a fix
      # available - failing CI for something nobody can currently fix
      # would just be noise, not something worth blocking a merge for.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  docker:
    name: Docker image build
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          platforms: linux/amd64
          tags: vyos-client:ci
          load: true

      # Scans the actual production image's OS/library layers
      # (distroless base + the statically-built Go binary) - separate
      # from trivy-fs above, which only sees source-level dependency
      # manifests, not what actually ends up in the shipped image.
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: vyos-client:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Validate docker-compose stack builds and starts
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose up --build -d
          timeout 30 sh -c 'until curl -skf https://localhost:8443/healthz; do sleep 1; done'
          docker compose logs
          docker compose down
